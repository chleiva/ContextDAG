  mistral.mistral-large-3-675b-instruct: {input: 0.50, output: 1.50}
  openai.gpt-oss-120b-1:0: {input: 0.15, output: 0.60}      # AWS Bedrock pricing page, 14 Sep 2026
  gpt-5-mini: {input: 0.25, output: 2.00}                   # developers.openai.com/api/docs/pricing, 14 Sep 2026 (output incl. reasoning tokens)
  gpt-5-nano: {input: 0.05, output: 0.40}
