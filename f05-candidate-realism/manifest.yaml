  global.anthropic.claude-haiku-4-5-20251001-v1:0: {input: 1.00, output: 5.00}    # same model via the global profile (region fallback)
  us.anthropic.claude-opus-4-6-v1: {input: 5.00, output: 25.00}
  global.anthropic.claude-opus-4-6-v1: {input: 5.00, output: 25.00}
  deepseek.v3.2: {input: 0.62, output: 1.85}
