# ContextDAG F0 oracle feasibility: the single file the whole run is reproducible from.
# Decision thresholds below are pre-registered. Do not change them after looking at results.

run:
  name: f0-oracle-feasibility
  version: 1
  created: 2026-09-13
  seed: 20260913

provider:
  name: amazon-bedrock
  client: anthropic.AnthropicBedrock        # legacy InvokeModel client; the Mantle client 404s on this account
  region: us-east-1
  auth_env: AWS_BEARER_TOKEN_BEDROCK

models:
  response_a:
    id: us.anthropic.claude-sonnet-4-6
    display: Claude Sonnet 4.6
    role: strong response model
    temperature: 0.0
    max_tokens: 2048
  response_b:
    id: us.anthropic.claude-haiku-4-5-20251001-v1:0
    display: Claude Haiku 4.5
    role: weaker response model (substitute for an open-weight model, none reachable in this environment)
    temperature: 0.0
    max_tokens: 2048
  judge:
    id: us.anthropic.claude-opus-4-6-v1
    display: Claude Opus 4.6
    role: LLM judge; distinct from both response models
    temperature: 0.0
    max_tokens: 2048
  summarizer:
    # rolling-summary baseline uses the response model under evaluation, so the baseline
    # is self-contained per model (no cross-model leakage of a stronger summarizer)
    policy: same_as_response_model
    max_tokens: 400
  generator:
    id: us.anthropic.claude-sonnet-4-6
    display: Claude Sonnet 4.6
    role: writes dialogue that realizes a pre-decided gold dependency graph
    temperature: 0.8
    max_tokens: 16000
  embedding:
    id: sentence-transformers/all-mpnet-base-v2
    runs: local
  tokenizer:
    library: tiktoken
    encoding: cl100k_base
    note: approximation for Claude models; what matters is every method is counted the same way

context_methods:
  # Handoff default was [2048, 4096]. Changed BEFORE the full run (13 Sep 2026) after the
  # pilot measured a mean full-history context of ~800 tokens (6-10 turn scenarios): at
  # 4096 the windowed baselines would equal full history on ~85% of scenarios and carry
  # no information. [1024, 2048] makes both budgets actually bind on typical scenarios
  # while 2048 stays comparable to the handoff's lower budget.
  window_budgets_tokens: [1024, 2048]
  methods:
    - full_history            # no budget
    - sliding_window          # per budget
    - rolling_summary         # per budget
    - semantic_retrieval      # per budget
    - oracle_tree             # no budget, primary-parent chain only
    - oracle_dag              # no budget, full ancestor closure (system under test)
  summary_prompt: >-
    Summarize the key facts, decisions, and constraints from this conversation excerpt
    in under 150 words, preserving any specific numbers, names, or rules stated

response_system_prompt: |
  You are a helpful assistant continuing an ongoing conversation. You will be shown
  some prior turns of the conversation, followed by the user's latest message.
  Respond only to the latest message, using the prior turns as context where relevant.
  If the provided context does not contain information you would need to answer
  completely, say so explicitly rather than guessing.

benchmark:
  min_scenarios: 130
  target_scenarios: 140
  turns_min: 6
  turns_max: 45
  family_targets:
    continuation: 10
    topic_fork: 10
    resume: 15
    new_root: 8
    two_branch_join: 15
    three_way_join: 8
    semantic_decoy: 12
    constraint_retention: 12
    knowledge_update: 12
    ambiguous_reference: 8
    long_noisy_side_thread: 10
    join_then_split: 10
    compound_turn: 10

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95
  join_families: [two_branch_join, three_way_join, join_then_split]

decision_thresholds:
  quality_non_inferiority_margin_pp: 5      # oracle DAG must score within 5 percentage points of full history, or better
  min_token_reduction_pct: 40               # oracle DAG must reduce avg context tokens by at least this much vs full history
  join_advantage_required: true             # oracle DAG must beat oracle tree on join-family checklist score

# Cost guardrail. Every LLM call is priced from actual token usage and appended to
# results/raw/cost_ledger.jsonl; calls refuse to start once the hard limit is reached.
pricing_usd_per_1m_tokens:            # Bedrock list prices, checked 13 Sep 2026
  us.anthropic.claude-sonnet-4-6: {input: 3.00, output: 15.00}
  us.anthropic.claude-haiku-4-5-20251001-v1:0: {input: 1.00, output: 5.00}
  us.anthropic.claude-opus-4-6-v1: {input: 5.00, output: 25.00}
budget:
  estimate_usd: 52
  warn_usd: 52          # print a warning once cumulative spend passes this
  hard_limit_usd: 70    # refuse any further LLM call once cumulative spend reaches this
