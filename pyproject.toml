[project]
name = "contextdag"
version = "0.0.1"
description = "F0 oracle feasibility study for dependency-graph conversation context"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "anthropic[bedrock]>=1.5",
  "sentence-transformers",
  "tiktoken",
  "numpy",
  "pandas",
  "matplotlib",
  "pyyaml",
  "pydantic>=2",
]

[project.optional-dependencies]
# F0.5 candidate generator: local NER (install the model with `python -m spacy download en_core_web_sm`)
f05 = ["spacy>=3.8", "boto3>=1.40", "scipy", "scikit-learn"]
